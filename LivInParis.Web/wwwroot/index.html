<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liv'In Paris</title>
  <meta name="description" content="Des plats faits maison par des cuisiniers parisiens, livrés en métro.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d9480f'/><text x='16' y='22' font-size='15' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'>LP</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="entete">
    <div class="entete-contenu">
      <button class="btn btn-fantome btn-icone menu-mobile" id="btn-menu" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a class="logo" href="#/"><span class="logo-pastille">LP</span><span>Liv'In Paris</span></a>
      <nav class="nav" id="nav"></nav>
      <span class="espace-entete"></span>
      <div class="entete-actions">
        <button class="btn btn-fantome btn-icone" id="btn-theme" aria-label="Changer de thème">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn btn-fantome btn-icone bouton-panier" id="btn-panier" aria-label="Panier">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
          <span class="compteur hidden" id="compteur-panier">0</span>
        </button>
        <div id="zone-compte"></div>
      </div>
    </div>
  </header>

  <main id="vue"></main>

  <div class="voile" id="voile"></div>
  <aside class="tiroir" id="tiroir" aria-label="Panier">
    <div class="tiroir-entete">
      <h2>Votre panier</h2>
      <button class="btn btn-fantome btn-icone" id="fermer-panier" aria-label="Fermer">✕</button>
    </div>
    <div class="tiroir-corps" id="contenu-panier"></div>
    <div class="tiroir-pied" id="pied-panier"></div>
  </aside>

  <dialog id="modale">
    <div class="modale-entete"><h2 id="modale-titre"></h2><button class="btn btn-fantome btn-icone" id="fermer-modale" aria-label="Fermer">✕</button></div>
    <div class="modale-corps" id="modale-corps"></div>
  </dialog>

  <div class="toasts" id="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
